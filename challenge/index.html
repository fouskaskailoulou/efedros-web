<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EFEDROS — Πρόσκληση</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1f0f;
    color: #e8d87f;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .logo {
    width: min(200px, 55vw);
    height: auto;
    border-radius: 16px;
    margin-bottom: 20px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  }
  .subtitle {
    font-size: 11px;
    letter-spacing: 2px;
    color: #8a9a60;
    margin-bottom: 32px;
    text-transform: uppercase;
  }
  .card {
    background: #252d14;
    border: 1px solid #4a5a2a;
    border-radius: 16px;
    padding: 28px 32px;
    max-width: 360px;
    width: 100%;
    margin-bottom: 24px;
  }
  .card-title {
    font-size: 11px;
    letter-spacing: 3px;
    color: #8a9a60;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .challenge-code {
    font-size: 36px;
    font-weight: 900;
    letter-spacing: 8px;
    color: #e8d87f;
    font-variant-numeric: tabular-nums;
  }
  .challenge-note {
    font-size: 12px;
    color: #6a7a4a;
    margin-top: 8px;
  }
  .btn {
    display: block;
    width: 100%;
    max-width: 360px;
    padding: 16px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 2px;
    text-decoration: none;
    text-transform: uppercase;
    cursor: pointer;
    border: none;
    margin-bottom: 12px;
  }
  .btn-primary { background: #e8d87f; color: #1a1f0f; }
  .btn-secondary {
    background: transparent;
    border: 1px solid #4a5a2a;
    color: #8a9a60;
    font-size: 13px;
  }
  .footer { font-size: 11px; color: #4a5a2a; margin-top: 16px; }
</style>
</head>
<body>
<img class="logo" src="../efedros_logo.jpg" alt="EFEDROS">
<p class="subtitle">Στρατιωτικό Quiz για Έλληνες</p>

<div class="card">
  <div class="card-title">Κωδικός Πρόσκλησης</div>
  <div class="challenge-code" id="code">—</div>
  <div class="challenge-note">Κατέβασε το app και εισήγαγε τον κωδικό για να παίξεις</div>
</div>

<a class="btn btn-primary" href="https://play.google.com/store/apps/details?id=gr.efedros.app">
  Κατέβασε το EFEDROS
</a>
<a class="btn btn-secondary" id="open-app-btn" href="#">
  Άνοιξε στο App
</a>
<p class="footer">© 2025 EFEDROS</p>

<script>
  var parts = window.location.pathname.split('/');
  var code = parts[parts.length - 1] || parts[parts.length - 2] || '';
  if (code && code !== 'challenge') {
    document.getElementById('code').textContent = code.toUpperCase();
    document.getElementById('open-app-btn').href = 'efedros://challenge/' + code;
  } else {
    document.getElementById('open-app-btn').style.display = 'none';
  }
</script>
</body>
</html>
