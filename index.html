<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EFEDROS — Στρατιωτικό Quiz</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1f0f;
    color: #e8d87f;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .logo {
    width: min(280px, 70vw);
    height: auto;
    border-radius: 20px;
    margin-bottom: 28px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  }
  .tagline {
    font-size: 13px;
    letter-spacing: 3px;
    color: #8a9a60;
    margin-bottom: 32px;
    text-transform: uppercase;
  }
  .btn {
    display: inline-block;
    padding: 16px 48px;
    background: #e8d87f;
    color: #1a1f0f;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 2px;
    text-decoration: none;
    border-radius: 12px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<img class="logo" src="efedros_logo.jpg" alt="EFEDROS">
<p class="tagline">Στρατιωτικό Quiz για Έλληνες</p>
<a class="btn" href="https://play.google.com/store/apps/details?id=gr.efedros.app">Κατέβασε Δωρεάν</a>
</body>
</html>
